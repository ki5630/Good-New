<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good & New 朝会ルーレット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        
        body {
            font-family: 'M PLUS Rounded+ 1c', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }

        .roulette-active {
            animation: pulse 0.15s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; background-color: #eef2ff; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .celebrate {
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .topic-result-card {
            background: white;
            border: 2px solid #e0e7ff;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 mb-2">☀️ Good & New 朝会</h1>
            <p class="text-gray-600">「良かったこと」や「新しい発見」をシェアしましょう！</p>
            <div id="status" class="inline-block mt-2 px-3 py-1 bg-green-100 text-green-700 text-xs rounded-full">準備完了</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Left Column: Member Management -->
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                <h2 class="text-xl font-bold mb-4 flex items-center">
                    <span class="mr-2">👥</span> メンバー
                </h2>
                <div class="flex mb-4">
                    <input type="text" id="nameInput" placeholder="名前を入力..." class="flex-1 px-3 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-400">
                    <button id="addBtn" onclick="addMember()" class="bg-indigo-500 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-600 transition">追加</button>
                </div>
                <ul id="memberList" class="space-y-2 max-h-64 overflow-y-auto pr-2">
                    <!-- Members will be rendered here -->
                </ul>
                <div class="mt-4 text-sm text-gray-500" id="memberCount">現在の人数: 0人</div>
            </div>

            <!-- Middle & Right Columns: Main Action Area -->
            <div class="md:col-span-2 space-y-6">
                
                <!-- Topic Section -->
                <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 flex items-center">
                        <span class="mr-2">💡</span> 本日のお題
                    </h2>
                    <div id="topicDisplay" class="bg-indigo-50 p-6 rounded-xl text-center min-h-[200px] flex flex-col items-center justify-center border-2 border-dashed border-indigo-200 px-4">
                        <span id="topicInstruction" class="text-indigo-800 text-lg font-medium">「お題を出す」ボタンを押してください</span>
                        
                        <!-- Spinning slots display -->
                        <div id="topicRouletteArea" class="hidden grid grid-cols-1 gap-3 w-full mt-2">
                            <div class="topic-slot bg-white p-3 rounded-lg border border-indigo-100 text-indigo-400 text-sm italic">...</div>
                            <div class="topic-slot bg-white p-3 rounded-lg border border-indigo-100 text-indigo-400 text-sm italic">...</div>
                            <div class="topic-slot bg-white p-3 rounded-lg border border-indigo-100 text-indigo-400 text-sm italic">...</div>
                        </div>

                        <!-- Results List (Static) -->
                        <div id="topicResults" class="grid grid-cols-1 gap-3 w-full mt-4 hidden">
                            <!-- Static topic results will be generated here -->
                        </div>
                    </div>
                    <button id="topicBtn" onclick="generateTopic()" class="w-full mt-4 bg-white border-2 border-indigo-500 text-indigo-500 font-bold py-3 rounded-xl hover:bg-indigo-50 transition flex items-center justify-center shadow-sm active:scale-95">
                        🎲 お題スロットを回す！
                    </button>
                </div>

                <!-- Speaker Section -->
                <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 flex items-center">
                        <span class="mr-2">🎯</span> スピーカー決定 (2名)
                    </h2>
                    
                    <div id="selectionArea" class="grid grid-cols-2 gap-4 mb-6">
                        <div id="speaker1" class="bg-gray-100 p-8 rounded-xl text-center flex flex-col items-center justify-center min-h-[140px]">
                            <span class="text-gray-400 text-sm mb-2">Speaker 1</span>
                            <div class="speaker-name text-2xl font-bold">???</div>
                        </div>
                        <div id="speaker2" class="bg-gray-100 p-8 rounded-xl text-center flex flex-col items-center justify-center min-h-[140px]">
                            <span class="text-gray-400 text-sm mb-2">Speaker 2</span>
                            <div class="speaker-name text-2xl font-bold">???</div>
                        </div>
                    </div>

                    <button id="spinBtn" onclick="startRoulette()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-xl shadow-lg hover:bg-indigo-700 transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        🎡 ルーレットを回す！
                    </button>
                    
                    <p id="errorMsg" class="text-red-500 text-center mt-3 hidden text-sm">※2人以上のメンバーを追加してください</p>
                </div>

            </div>
        </div>

        <!-- Instructions -->
        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>Good & New: 「良かったこと」や「新しい発見」を、拍手とともに共有するワークショップです。</p>
        </footer>
    </div>

    <script type="module">
        let db = null;
        let auth = null;
        let membersRef = null;
        let isCloudMode = false;

        const firebaseConfigRaw = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'morning-meeting-app';

        let members = [];
        let isSpinning = false;
        let isTopicSpinning = false;

        const listEl = document.getElementById('memberList');
        const countDisplay = document.getElementById('memberCount');
        const statusEl = document.getElementById('status');
        const nameInput = document.getElementById('nameInput');

        async function init() {
            if (firebaseConfigRaw) {
                try {
                    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                    const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                    const { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                    const config = JSON.parse(firebaseConfigRaw);
                    const app = initializeApp(config);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    isCloudMode = true;

                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (token) await signInWithCustomToken(auth, token);
                    else await signInAnonymously(auth);

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            statusEl.innerText = "クラウド同期中 🟢";
                            membersRef = collection(db, 'artifacts', appId, 'public', 'data', 'members');
                            onSnapshot(membersRef, (snapshot) => {
                                members = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                renderMembers();
                            }, (err) => {
                                console.error("Firestore error:", err);
                                useLocalStorage();
                            });
                        }
                    });
                } catch (e) {
                    console.warn("Cloud setup failed, fallback to local:", e);
                    useLocalStorage();
                }
            } else {
                useLocalStorage();
            }
        }

        function useLocalStorage() {
            isCloudMode = false;
            statusEl.innerText = "ローカル保存モード 💾";
            const saved = localStorage.getItem('gn_members');
            if (saved) {
                members = JSON.parse(saved);
            } else {
                members = [
                    { id: '1', name: 'なおさん' }, { id: '2', name: 'さきちゃん' },
                    { id: '3', name: 'るんくん' }, { id: '4', name: 'ありちゃん' },
                    { id: '5', name: 'しーちゃん' }, { id: '6', name: 'たけちゃん' },
                    { id: '7', name: 'すぎむー' }
                ];
                saveLocal();
            }
            renderMembers();
        }

        window.addMember = async () => {
            const name = nameInput.value.trim();
            if (!name) return;
            if (isCloudMode && membersRef) {
                const { addDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                await addDoc(membersRef, { name, timestamp: Date.now() });
            } else {
                members.push({ id: Date.now().toString(), name });
                saveLocal();
                renderMembers();
            }
            nameInput.value = '';
        };

        window.removeMember = async (id) => {
            if (isCloudMode && db) {
                const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'members', id);
                await deleteDoc(docRef);
            } else {
                members = members.filter(m => m.id !== id);
                saveLocal();
                renderMembers();
            }
        };

        function saveLocal() {
            if (!isCloudMode) localStorage.setItem('gn_members', JSON.stringify(members));
        }

        function renderMembers() {
            listEl.innerHTML = '';
            members.forEach((member) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-50 p-2 rounded-lg fade-in';
                li.innerHTML = `
                    <span class="font-medium">${member.name}</span>
                    <button onclick="removeMember('${member.id}')" class="text-gray-400 hover:text-red-500 transition">✕</button>
                `;
                listEl.appendChild(li);
            });
            countDisplay.innerText = `現在の人数: ${members.length}人`;
            document.getElementById('errorMsg').classList.toggle('hidden', members.length >= 2);
        }

        // ユニークなお題リスト (計95個)
        const topics = [
            "昨日の夜、寝る前にふと考えた幸せなこと 🌙", "最近、誰かに「ありがとう」と言われたエピソード 🙏",
            "今の気分を「天気」で例えると何？ ☀️🌧️🌀", "最近見つけた、街の中の小さな素敵な景色 📸",
            "コンビニで見つけて思わず買ってしまったもの 🏪", "最近、自分のささやかな成長を感じた瞬間 🌱",
            "忙しい時に自分を癒してくれるお助けアイテム 🧘", "もし1日だけ別の職業になれるなら、何になりたい？ 🚀",
            "最近、一口飲んで「美味しい！」と思った飲み物 ☕", "自分の名前の由来や、気に入っているところ 📛",
            "最近、少し勇気を出して初めてやってみたこと 🦁", "ずっと大切にしている自分だけの習慣や宝物 ✨",
            "最近、心が動かされたニュースや出来事 📰", "「これさえあれば頑張れる」という自分のスイッチ 🔘",
            "もし無人島に一つだけ持っていくなら何？ 🏝️", "最近、一番「スッキリした」出来事 🧼",
            "自分が思う、今の自分の一番のチャームポイント 😊", "もしペットを飼うなら、どんな動物と暮らしたい？ 🐕",
            "最近、人から勧められて試してみたこと 💡", "子供の頃の自分が今の自分を見たら、なんて言うと思う？ 👦",
            "自分にとって理想の「朝の過ごし方」は？ 🥞", "最近、思わず「おっ」と驚いた発見 😲",
            "自分の部屋の中で一番お気に入りの場所 🏠", "最近、一番時間を忘れて没頭したこと ⌛",
            "魔法が一つだけ使えるなら、どんな魔法がいい？ 🪄", "最近、人知れず頑張った自分への「お疲れ様」 🏆",
            "これから1年以内に叶えたい、ささやかな夢 🎈", "最近、自分の中で密かにブームになっている言葉 🗣️",
            "誰にも言っていない、自分だけの小さなこだわり 🔍", "最近買った服や小物の、お気に入りポイントは？ 👗",
            "自分が思う、一番心が落ち着く「音」は？ 🌊", "最近、誰かのためにした「小さな良いこと」 🤝",
            "人生で一度は行ってみたい、憧れの場所 🗺️", "最近スマホで撮った、一番お気に入りの写真 📱",
            "もし自分が歴史上の人物になれるなら誰？ ⚔️", "最近、自分を笑顔にしてくれた誰かの行動 😄",
            "今の仕事道具の中で、一番愛着があるもの 💻", "もし明日から1週間の休みをもらえたら、何をする？ ✈️",
            "最近、一番「頑張ってよかった」と思ったこと 💮", "最近、気になっている新しい趣味や習い事 🎨",
            "もし空を飛べたら、一番最初に見たい景色はどこ？ 🕊️", "自分が一番元気になれる「最強の食べ物」は？ 🍖",
            "最近、解決した小さな悩み事や困り事 🧩", "10年後の自分へ、今の自分からメッセージを送るなら？ ✉️",
            "最近、一番感動した映画や動画のワンシーン 🎬", "今の自分の「やる気」をパーセントで表すと何％？ 📊",
            "今日、この朝会が終わった後の楽しみな予定は？ 🍰", "最近、思わず「懐かしい！」と叫んだもの 📺", 
            "もし明日、世界が終わるなら最後に何食べる？ 🍱", "今年中にマスターしたい特技や知識 🛠️", 
            "自分にとっての「究極の休日」の過ごし方 🏖️", "最近、思わず拍手したくなった誰かのファインプレー 👏", 
            "自分だけの、秘密の「やる気が出る曲」 🎧", "もし、どこでもドアがあったら今すぐどこに行く？ 🚪", 
            "最近、一番美味しかった自炊料理（またはお店の味） 🍛", "最近、誰かに褒められて嬉しかったポイント 🌟", 
            "もし自分が動物園の飼育員なら、どの動物を担当したい？ 🐘", "最近、自分の中で「これって大人だな」と思った瞬間 🍷", 
            "おすすめのストレス解消法を教えて！ 🛁", "もし10億円当たったら、まず何にお金を使う？ 💰", 
            "自分の出身地の、自慢できるポイント 🏡", "最近、一番驚いた「世の中の変化」 🌎", 
            "もし超能力が一つ手に入るなら何を選ぶ？ ✨", "自分の中で、実は自信がある小さなこと 🏅", 
            "最近、心をリフレッシュするためにしたこと 🌿", "もし自分が漫画の主人公なら、どんな設定がいい？ 🦸", 
            "最近、新しく覚えた便利機能や裏技 💻", "今の自分に、一言「あっぱれ！」をあげるなら？ 🚩", 
            "もし、自分の名前を変えられるなら何にする？ 📛", "最近、一番「贅沢したな〜」と思った瞬間 💎", 
            "これまでの人生で、一番印象に残っている旅の景色 ✈️", "最近、思わず二度見してしまった面白いもの 👀", 
            "自分の中で、欠かせない「モーニングルーティン」 ☀️", "もし自分が雑誌の編集長なら、どんな特集を組む？ 📚", 
            "最近、心から「リラックスした」場所や時間 🕯️", "もし自分がYouTuberなら、どんな企画をやる？ 🎥", 
            "最近、自分の直感が「当たった！」と思ったこと 🎯", "もし、自分の家を自由にリフォームできるなら？ 🏠", 
            "最近、誰かの優しさに触れてホッとしたこと 🍵", "自分だけの、お気に入り「パワーワード」 💬", 
            "もし、好きな時代の有名人と食事ができるなら？ 🍽️", "最近、自分の中で一番大きな「断捨離」をしたもの 📦", 
            "もし自分が発明家なら、どんな便利グッズを作る？ 🛠️", "最近、一番「ワクワク」しながら待っていたこと 🎁", 
            "今の自分を漢字一文字で表すと何？ 🖌️", "もし、自分の銅像が建つならどこに建てたい？ 🗿", 
            "最近、自分の中で「やり切った！」と達成感を感じたこと 🏃", "最近の「ちょっとした贅沢品」を教えて 🍫", 
            "もし自分の人生がドラマなら、今は何話目くらい？ 📺", "最近、一番「癒された」動画や画像 🐾", 
            "もし、一日だけ歴史的な事件を阻止できるなら？ 🕰️", "最近の自分に、エールを送るならどんな言葉？ 📣", 
            "もし、新しい祝日を作れるなら何の日がいい？ 🗓️", "今日、自分が「一番楽しみなこと」を宣言して！ 🚀"
        ];

        window.generateTopic = () => {
            if (isTopicSpinning) return;
            isTopicSpinning = true;

            const rouletteArea = document.getElementById('topicRouletteArea');
            const resultsContainer = document.getElementById('topicResults');
            const instruction = document.getElementById('topicInstruction');
            const slots = document.querySelectorAll('.topic-slot');
            const topicBtn = document.getElementById('topicBtn');
            
            // UIリセット
            resultsContainer.classList.add('hidden');
            instruction.classList.remove('hidden');
            instruction.innerText = "シャッフル中...";
            rouletteArea.classList.remove('hidden');
            topicBtn.disabled = true;

            let elapsed = 0;
            const duration = 1800;
            const interval = 80;

            const timer = setInterval(() => {
                elapsed += interval;
                
                slots.forEach(slot => {
                    const rand = topics[Math.floor(Math.random() * topics.length)];
                    slot.innerText = rand;
                    slot.classList.add('roulette-active');
                });

                if (elapsed >= duration) {
                    clearInterval(timer);
                    stopTopicRoulette();
                }
            }, interval);
        };

        function stopTopicRoulette() {
            const rouletteArea = document.getElementById('topicRouletteArea');
            const resultsContainer = document.getElementById('topicResults');
            const instruction = document.getElementById('topicInstruction');
            const topicBtn = document.getElementById('topicBtn');
            const slots = document.querySelectorAll('.topic-slot');

            // 最終結果を3つ選ぶ
            const shuffled = [...topics].sort(() => 0.5 - Math.random());
            const finalTopics = shuffled.slice(0, 3);

            rouletteArea.classList.add('hidden');
            slots.forEach(s => s.classList.remove('roulette-active'));
            
            instruction.innerText = "1つ選んで話そう！";
            resultsContainer.classList.remove('hidden');
            resultsContainer.innerHTML = '';

            finalTopics.forEach((topic) => {
                const div = document.createElement('div');
                div.className = 'topic-result-card w-full p-4 rounded-xl text-indigo-700 font-bold shadow-sm fade-in flex items-center justify-center min-h-[50px]';
                div.innerText = topic;
                resultsContainer.appendChild(div);
            });

            topicBtn.disabled = false;
            isTopicSpinning = false;
        }

        window.startRoulette = async () => {
            if (isSpinning || members.length < 2) return;
            isSpinning = true;
            
            const spinBtn = document.getElementById('spinBtn');
            const speaker1El = document.getElementById('speaker1');
            const speaker2El = document.getElementById('speaker2');
            const name1El = speaker1El.querySelector('.speaker-name');
            const name2El = speaker2El.querySelector('.speaker-name');

            spinBtn.disabled = true;
            speaker1El.classList.add('roulette-active');
            speaker2El.classList.add('roulette-active');
            speaker1El.classList.remove('bg-indigo-500', 'text-white', 'celebrate');
            speaker2El.classList.remove('bg-indigo-500', 'text-white', 'celebrate');

            let duration = 2000; 
            let interval = 50;
            let elapsed = 0;

            const timer = setInterval(() => {
                elapsed += interval;
                const tempIdx1 = Math.floor(Math.random() * members.length);
                let tempIdx2 = Math.floor(Math.random() * members.length);
                while(tempIdx2 === tempIdx1 && members.length > 1) tempIdx2 = Math.floor(Math.random() * members.length);
                
                name1El.innerText = members[tempIdx1].name;
                name2El.innerText = members[tempIdx2].name;

                if (elapsed >= duration) {
                    clearInterval(timer);
                    const shuffled = [...members].sort(() => 0.5 - Math.random());
                    name1El.innerText = shuffled[0].name;
                    name2El.innerText = shuffled[1].name;
                    speaker1El.classList.remove('roulette-active');
                    speaker2El.classList.remove('roulette-active');
                    speaker1El.classList.add('bg-indigo-500', 'text-white', 'celebrate');
                    speaker2El.classList.add('bg-indigo-500', 'text-white', 'celebrate');
                    spinBtn.disabled = false;
                    isSpinning = false;
                }
            }, interval);
        };

        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.addMember(); });
        init();
    </script>
</body>
</html>
